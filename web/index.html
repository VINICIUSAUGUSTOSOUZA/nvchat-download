<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="NVChat Web — converse usando a mesma conta do aplicativo NVChat." />
  <title>NVChat Web</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <main class="app-shell">
    <section id="authView" class="auth-view">
      <div class="auth-card">
        <div class="brand-mark">NV</div>
        <h1>NVChat Web</h1>
        <p>Entre com a mesma conta usada no aplicativo.</p>
        <form id="loginForm">
          <label>E-mail<input id="email" type="email" autocomplete="email" required /></label>
          <label>Senha<input id="password" type="password" autocomplete="current-password" required /></label>
          <button id="loginButton" type="submit">Entrar</button>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="chatView" class="chat-view hidden">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div><strong>NVChat</strong><small id="currentUserName">Web</small></div>
          <button id="logoutButton" class="ghost" type="button">Sair</button>
        </header>
        <div id="conversationList" class="conversation-list"></div>
      </aside>

      <section class="conversation-panel">
        <header class="conversation-header">
          <button id="backButton" class="ghost mobile-only" type="button">‹</button>
          <div><strong id="conversationName">Selecione uma conversa</strong><small id="conversationStatus"></small></div>
        </header>
        <div id="messages" class="messages empty-state">Escolha uma conversa para começar.</div>
        <form id="messageForm" class="composer hidden">
          <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Digite uma mensagem" aria-label="Mensagem"></textarea>
          <button type="submit">Enviar</button>
        </form>
      </section>
    </section>
  </main>

  <script src="../assets/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
