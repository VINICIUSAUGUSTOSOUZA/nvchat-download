<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#166534">
  <title>NVChat - Redirecionando</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}.card{width:min(480px,100%);background:#fff;border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.09)}h1{margin:0 0 8px;color:#166534;font-size:28px}p{color:#4b5563;line-height:1.55}.spinner{width:38px;height:38px;border:4px solid #dcfce7;border-top-color:#166534;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}a{display:inline-block;margin-top:8px;padding:11px 15px;border-radius:9px;background:#166534;color:#fff;text-decoration:none;font-weight:700}.error .spinner{display:none}.error h1{color:#991b1b}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main id="card" class="card">
    <h1 id="title">NVChat</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="message">Abrindo seu link...</p>
    <a id="home-link" href="./" hidden>Ir para o site do NVChat</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    (async () => {
      const card = document.getElementById('card');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const home = document.getElementById('home-link');
      const fail = (text) => {
        card.classList.add('error');
        title.textContent = 'Link não encontrado';
        message.textContent = text;
        home.hidden = false;
      };

      const cfg = window.NVCHAT_SUPABASE;
      if (!cfg?.url || !cfg?.publishableKey || !window.supabase) return fail('Não foi possível abrir este link agora.');

      const path = window.location.pathname.replace(/\/+$/, '');
      const code = decodeURIComponent(path.split('/').pop() || '').trim().toLowerCase();
      if (!/^[a-z0-9][a-z0-9_-]{2,31}$/.test(code)) return fail('Confira o endereço e tente novamente.');

      const client = window.supabase.createClient(cfg.url, cfg.publishableKey);
      const { data, error } = await client.rpc('resolve_nvchat_short_link', { p_code: code });
      const destination = Array.isArray(data) ? data[0]?.destination_url : data?.destination_url;
      if (error || !destination) return fail('Este link não existe ou está pausado.');

      window.location.replace(destination);
    })();
  </script>
</body>
</html>
