name: Publicar NVChat mais recente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar build aprovado
        shell: bash
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3d50-820e-99f6-2b7a4df8af3f/raw?se=2026-08-31T20%3A23%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=309b1be8-8c4e-5626-8042-58c0aeb5d464&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T12%3A41%3A32Z&ske=2026-09-01T12%3A41%3A32Z&sks=b&skv=2026-02-06&sig=jlPAYeJGP8yFtSPWdmg0k1nEcmCF6T9HjEZIdzlprgg%3D' -o /tmp/NVChat-builds.zip
          unzip -j /tmp/NVChat-builds.zip 'dist/NVChat-Android7-universal.apk' -d /tmp
          echo '64f055cd32675c4ca55719c376b4b0bf40e5d9f3bf04bd58b6b8fcadead5081c  /tmp/NVChat-Android7-universal.apk' | sha256sum -c -

      - name: Atualizar APK publico
        shell: bash
        run: |
          cp /tmp/NVChat-Android7-universal.apk NVChat-Android7-universal.apk
          cp /tmp/NVChat-Android7-universal.apk NV-Chat.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NVChat-Android7-universal.apk NV-Chat.apk
          git rm .github/workflows/publish-latest.yml
          git commit -m 'Publica build API 36 mais recente do NVChat'
          git push
