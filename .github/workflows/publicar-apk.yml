name: Publicar APK atualizado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar APK compilado
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-023c-820e-8d45-c277ee2ada60/raw?se=2026-08-30T00%3A06%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=17eaa87c-1d5b-5e1d-9a5d-3bbfd76a5360&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T13%3A07%3A33Z&ske=2026-08-30T13%3A07%3A33Z&sks=b&skv=2026-02-06&sig=YWVVoAuJ6dLMZ6vK0ev7In7yFzvv%2BLHG/EXmc/hBeW0%3D"
        run: |
          curl -L --fail "$ARTIFACT_URL" -o /tmp/nvchat.zip
          mkdir -p /tmp/nvchat
          unzip -o /tmp/nvchat.zip -d /tmp/nvchat
          APK=$(find /tmp/nvchat -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" NV-Chat.apk

      - name: Publicar APK no site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NV-Chat.apk
          if git diff --cached --quiet; then
            echo "APK sem alteração"
            exit 0
          fi
          git commit -m "Atualiza APK com áudio no auricular"
          git push
